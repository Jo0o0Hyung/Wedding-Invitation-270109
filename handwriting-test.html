<title>handwriting animation test</title>
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Pretendard&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#4a5247; color:#fff; font-family:system-ui,sans-serif; }
  .card { width:430px; margin:0 auto; }
  .demo { position:relative; background:linear-gradient(160deg,#7f8a76,#aab49f); margin-bottom:10px; padding:10px 0; }
  .label { font-size:12px; letter-spacing:.08em; padding:8px 10px 2px; opacity:.9; }
  svg { display:block; width:100%; height:auto; overflow:visible; }
  .ink { fill:none; stroke:#F8E7A0; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
         filter:drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
  .glyph { fill:#F8E7A0; filter:drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
  .pen { fill:none; stroke:#F8E7A0; stroke-linecap:round;
         filter:drop-shadow(0 2px 6px rgba(0,0,0,.35)); }

  /* A: ?ㅺ낸?좎쓣 ?곕씪 洹몃━湲?*/
  #a .ink { stroke-dasharray:1000; stroke-dashoffset:1000; animation:traceA 6s linear infinite; }
  #a .ink.l2 { animation-name:traceA2; }
  @keyframes traceA { 0%{stroke-dashoffset:1000} 35%{stroke-dashoffset:0} 85%{stroke-dashoffset:0;opacity:1} 95%{opacity:0} 100%{stroke-dashoffset:1000;opacity:0} }
  @keyframes traceA2 { 0%,18%{stroke-dashoffset:1000} 53%{stroke-dashoffset:0} 85%{stroke-dashoffset:0;opacity:1} 95%{opacity:0} 100%{stroke-dashoffset:1000;opacity:0} }

  /* B: ?쒖씠 吏?섍?硫?湲?먭? 梨꾩썙吏湲?*/
  #b .pen { stroke-dasharray:1000; stroke-dashoffset:1000; animation:penB 6s linear infinite; }
  #b .pen.l2 { animation-name:penB2; }
  @keyframes penB { 0%{stroke-dashoffset:1000} 30%{stroke-dashoffset:0} 85%{stroke-dashoffset:0;opacity:1} 95%{opacity:0} 100%{stroke-dashoffset:1000;opacity:0} }
  @keyframes penB2 { 0%,18%{stroke-dashoffset:1000} 48%{stroke-dashoffset:0} 85%{stroke-dashoffset:0;opacity:1} 95%{opacity:0} 100%{stroke-dashoffset:1000;opacity:0} }

  /* C: ??湲?먯뵫 ?섑??섍린 */
  #c .cline { font-family:"Mrs Saint Delafield",cursive; font-size:64px; color:#F8E7A0;
              text-shadow:0 2px 8px rgba(0,0,0,.35); white-space:nowrap; line-height:1.25; }
  #c .r1 { text-align:left; padding-left:16px; }
  #c .r2 { text-align:right; padding-right:16px; }
  #c span { opacity:0; animation:fadeC 6s linear infinite; }
  @keyframes fadeC { 0%,var(--s){opacity:0} 100%{opacity:0} }
